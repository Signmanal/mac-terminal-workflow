# Yazi 文件管理器配置

[manager]
# 显示隐藏文件
show_hidden = true
# 排序方式
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
# 行号显示
linemode = "size"
# 鼠标支持
show_symlink = true

[preview]
# 预览窗口
tab_size = 2
max_width = 600
max_height = 900
# 图片预览
image_filter = "lanczos3"
image_quality = 90

[opener]
# 文件打开方式
edit = [
  { run = 'nvim "$@"', block = true },
]
open = [
  { run = 'open "$@"', desc = "Open with default app" },
]
reveal = [
  { run = 'open -R "$@"', desc = "Reveal in Finder" },
]

[open]
# 文件类型关联
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "application/pdf", use = "open" },
]
